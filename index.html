<!DOCTYPE html>
<html lang="sk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ja a môj tím – OŠK Chorvátsky Grob</title>
<link rel="icon" href="assets/club.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&amp;family=Geist:wght@400..750&amp;display=swap">
<link rel="stylesheet" href="style.css?v=training-v3">
</head><body>
<header class="masthead">
  <div class="shell masthead-inner">
    <div class="club">
      <img src="assets/club.webp" alt="" width="34" height="34">
      <span>OŠK Chorvátsky Grob</span>
    </div>
    <label class="player-select"><span>Hráč</span><select id="who" aria-label="Hráč"></select></label>
  </div>
</header>
<div class="pitch">
  <div class="shell pitch-inner">
    <p class="pitch-team" id="pitch-team"></p>
    <h1>Ja a môj tím</h1>
  </div>
</div>
<div class="navigation"><nav class="shell" id="nav" aria-label="Sekcie denníka"></nav></div>
<main class="shell">
  <div class="section-heading">
    <h2 id="section-title"></h2>
    <p id="st" role="status"></p>
  </div>
  <div id="v"></div>
</main>
<dialog id="dlg"></dialog>
<dialog id="training-dialog" aria-labelledby="training-editor-heading"></dialog>
<script src="app.js?v=training-v3"></script>
<script src="training.js?v=training-v3"></script>
<script>
const F=window.Futbal,$=s=>document.querySelector(s);
const TABS={training:'Plán tréningov',prog:'Program',res:'Výsledky',team:'Tím',me:'Moje štatistiky',tbl:'Tabuľka'};
const TRAINING_HASH='#plan-treningov';
let tbl=null,officialPlayer=null,pid=localStorage.getItem('futbal:last')||'tomas',tab=location.hash===TRAINING_HASH?'training':'prog',sched=[],resu=[],S;
let refreshSequence=0;
let shownTrainingMonday;
const trainingPlan=window.createTrainingPlan($('#v'),$('#training-dialog'),()=>tab==='training');
const load=()=>{try{return JSON.parse(localStorage.getItem('futbal:'+pid))||{}}catch(e){return{}}};
const save=()=>localStorage.setItem('futbal:'+pid,JSON.stringify(S));
async function refresh(){
  const request=++refreshSequence;
  $('#st').textContent='Načítavam údaje…';
  try{
    const r=await fetch('data/'+F.PROFILES[pid].slug+'.json?'+Date.now());
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(request!==refreshSequence)return;
    sched=d.program||[];resu=d.vysledky||[];tbl=d.table||null;officialPlayer=d.playerStats||null;
    const t=new Date(d.updated);
    $('#st').textContent='Sportnet · '+t.toLocaleString('sk-SK',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
  }catch(e){
    if(request!==refreshSequence)return;
    $('#st').textContent='Údaje zo Sportnetu sa nepodarilo načítať';
  }
  render();
}
const all=()=>{const seen={},l=[];[...sched,...resu,...(S.manual||[])].forEach(m=>{if(!seen[m.id]){seen[m.id]=1;l.push(m)}});return l.sort((a,b)=>a.date.localeCompare(b.date))};
const E=()=>S.entries=S.entries||{};
const fd=d=>d?d.slice(8)+'.'+d.slice(5,7)+'.':'Termín neurčený';
const escapeText=value=>value.replace(/[&<>]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[char]));
function row(m){const e=E()[m.id]||{},v=F.view(m,e),r=v.gf===null?'':v.gf>v.ga?'W':v.gf===v.ga?'D':'L';
  return `<button type="button" class="card m" data-id="${m.id}"><span class="d${m.date?'':' pending'}">${fd(m.date)}${m.time?`<small>${m.time}</small>`:''}</span>
  <span class="t"><span class="opp">${escapeText(v.opp)}</span><span class="venue">${v.homeOurs?'Doma':'Vonku'}${e.played?` · ⚽${e.goals||0} 🎯${e.assists||0} ${e.mood||''}`:''}</span></span>
  <span class="sc ${r}">${v.gf===null?'–':v.gf+':'+v.ga}</span><span class="chevron" aria-hidden="true">›</span></button>`}

function renderPlayerStats(profile) {
  const fields=['appearances','minutes','goals','yellow','secondYellow','red'];
  const cells=stats=>fields.map(field=>`<td>${stats[field]??'–'}</td>`).join('');
  let content='<p class="note">Štatistiky zo Sportnetu zatiaľ nie sú k dispozícii.</p>';
  if(officialPlayer?.seasons.length){
    const seasons=officialPlayer.seasons.map(stats=>`<tr><th scope="row" class="text">${escapeText(stats.season)}</th>${cells(stats)}</tr>`).join('');
    content=`<div class="table-scroll" tabindex="0" role="region" aria-label="Štatistiky podľa sezóny">
      <table class="data-table player-table">
        <thead><tr><th scope="col" class="text">Sezóna</th><th scope="col">Zápasy</th><th scope="col">Minúty</th><th scope="col">Góly</th>
          <th scope="col" title="Žlté karty" aria-label="Žlté karty"><span class="card-mark" aria-hidden="true"></span>ŽK</th>
          <th scope="col" title="Druhé žlté karty" aria-label="Druhé žlté karty"><span class="card-mark second" aria-hidden="true"></span>2. ŽK</th>
          <th scope="col" title="Červené karty" aria-label="Červené karty"><span class="card-mark red" aria-hidden="true"></span>ČK</th></tr></thead>
        <tbody>${seasons}</tbody>
        <tfoot><tr><th scope="row" class="text">Celkovo</th>${cells(officialPlayer.overall)}</tr></tfoot>
      </table></div>`;
  }
  return `<section class="card"><div class="panel-title"><h3>${profile.name}</h3>
    <a href="${profile.url}#/futbal/statistiky/" target="_blank" rel="noopener">Štatistiky na Sportnete</a></div>${content}</section>`;
}

function renderStandings(profile){
  const link=`<a href="${F.BASE}${profile.slug}/tabulky/#/?competitionId=${profile.tableCompetition}&amp;partId=${profile.tablePart}" target="_blank" rel="noopener">Tabuľka na Sportnete</a>`;
  const rows=tbl?.map(r=>`<tr class="${F.isOurs(r.club)?'ours':''}"><td>${r.pos}</td><th scope="row" class="text">${escapeText(r.club)}</th><td>${r.z}</td><td>${r.v}</td><td>${r.r}</td><td>${r.p}</td><td>${r.gf}:${r.ga}</td><td><b>${r.pts}</b></td></tr>`).join('');
  const content=rows?`<div class="table-scroll" tabindex="0" role="region" aria-label="Poradie MZM B">
    <table class="data-table standings"><thead><tr><th scope="col">#</th><th scope="col" class="text">Klub</th>
    <th scope="col">Z</th><th scope="col">V</th><th scope="col">R</th><th scope="col">P</th><th scope="col">Skóre</th><th scope="col">B</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`:'<p class="note">Tabuľku sa zatiaľ nepodarilo načítať.</p>';
  return `<section class="card"><div class="panel-title"><h3>MZM B</h3>${link}</div>${content}</section>`;
}

function showTrainingPlan(dates){
  shownTrainingMonday=dates[0];
  trainingPlan.show(dates);
}

function render(){
  const profile=F.PROFILES[pid];
  $('#section-title').textContent=TABS[tab];
  $('#pitch-team').textContent=tab==='training'?'Tomáš a Oliver':profile.team;
  $('#st').hidden=tab==='training';
  $('#nav').innerHTML=Object.entries(TABS).filter(([k])=>k!=='tbl'||profile.tablePart).map(([k,t])=>`<button type="button" data-t="${k}"${k===tab?' class="on" aria-current="true"':''}>${t}</button>`).join('');
  if(tab==='training'){
    showTrainingPlan(F.trainingWeek());
    return;
  }
  const ms=all(),today=new Date().toISOString().slice(0,10),en=E();let h='';
  if(tab==='prog'){const l=ms.filter(m=>!m.closed&&(m.closed===false||m.date>=today)&&F.view(m,en[m.id]).gf===null)
    .sort((a,b)=>Number(!a.date)-Number(!b.date));
    h=l.map(row).join('')||'<div class="card">Žiadne naplánované zápasy</div>';
    h+='<button class="btn" id="add">+ Pridať zápas ručne</button>'}
  if(tab==='res'){const l=ms.filter(m=>m.closed||F.view(m,en[m.id]).gf!==null).reverse();h=l.map(row).join('')||'<div class="card">Zatiaľ žiadne výsledky</div>'}
  if(tab==='team'){const s=F.teamStats(ms,en);h=`<div class="grid">
   <div class="stat"><b>${s.gp}</b>zápasy</div><div class="stat g"><b>${s.pts}</b>body</div><div class="stat b"><b>${s.w}-${s.d}-${s.l}</b>V-R-P</div>
   <div class="stat g"><b>${s.gf}</b>strelené góly</div><div class="stat r"><b>${s.ga}</b>inkasované</div><div class="stat"><b>${s.gf-s.ga}</b>skóre rozdiel</div></div>`}
  if(tab==='tbl')h=renderStandings(profile);
  if(tab==='me'){
    const s=F.playerStats(en);
    h=renderPlayerStats(profile)+`<section class="journal"><div class="panel-title"><h3>Môj denník</h3></div>
      <div class="grid"><div class="stat b"><b>${s.played}</b>zápasy</div><div class="stat g"><b>${s.goals}</b>góly</div><div class="stat"><b>${s.assists}</b>asistencie</div></div></section>`;
    const matches=ms.filter(m=>en[m.id]?.played).reverse().map(row).join('');
    if(matches)h+=`<div class="journal">${matches}</div>`;
  }
  $('#v').innerHTML=h;
}
function edit(id){const m=all().find(x=>x.id===id),e=E()[id]||{},v=F.view(m,e),man=(S.manual||[]).some(x=>x.id===id);
  $('#dlg').innerHTML=`<h2>${escapeText(v.opp)}</h2>${man?`<label>Dátum a čas</label><div class="row"><input type="date" id="md" value="${m.date}"><input type="time" id="mt" value="${m.time||''}"></div><label>Súper</label><input type="text" id="mo2" value="${escapeText(v.opp).replace(/"/g,'&quot;')}"><label><input type="checkbox" id="mh" ${v.homeOurs?'checked':''}> Doma</label>`:`<div class="note">${fd(m.date)} ${m.time||''}</div>`}
  <label><input type="checkbox" id="p" ${e.played?'checked':''}> ✅ Hral som</label>
  <div class="row"><div><label>⚽ Góly</label><input type="number" min="0" id="g" value="${e.goals||0}"></div><div><label>🎯 Asistencie</label><input type="number" min="0" id="a" value="${e.assists||0}"></div></div>
  <label>Aký dojem z zápasu?</label><div class="moods" id="mo">${['😀','🙂','😐','🙁'].map(x=>`<button type="button" class="${e.mood===x?'on':''}">${x}</button>`).join('')}</div>
  <input type="text" id="n" aria-label="Poznámka" placeholder="Poznámka (voliteľné)" value="${escapeText(e.note||'').replace(/"/g,'&quot;')}" style="margin-top:8px">
  <label>Výsledok (naše : súper)</label><div class="row"><input type="number" min="0" id="gf" value="${v.gf??''}"><input type="number" min="0" id="ga" value="${v.ga??''}"></div>
  <div class="row" style="margin-top:14px"><button class="btn o" id="x">Zrušiť</button><button class="btn danger" id="del">${man?'Zmazať zápas':'Vymazať záznam'}</button><button class="btn" id="ok">Uložiť</button></div>`;
  let mood=e.mood||'';$('#mo').onclick=ev=>{if(ev.target.tagName!=='BUTTON')return;mood=ev.target.textContent;[...$('#mo').children].forEach(b=>b.classList.toggle('on',b===ev.target))};
  $('#x').onclick=()=>$('#dlg').close();
  $('#del').onclick=()=>{if(!confirm(man?'Naozaj zmazať tento zápas aj so záznamom?':'Vymazať tvoj záznam k tomuto zápasu (góly, asistencie, dojem, ručný výsledok)?'))return;if(man)S.manual=S.manual.filter(x=>x.id!==id);delete E()[id];save();$('#dlg').close();render()};
  $('#ok').onclick=()=>{if(man){const o=$('#mo2').value.trim(),d=$('#md').value;if(!o||!d){alert('Vyplň dátum a súpera');return}const us='OŠK Chorvátsky Grob',hm=$('#mh').checked;Object.assign(m,{date:d,time:$('#mt').value,home:hm?us:o,away:hm?o:us})}E()[id]={played:$('#p').checked,goals:+$('#g').value||0,assists:+$('#a').value||0,mood,note:$('#n').value,gf:$('#gf').value,ga:$('#ga').value};save();$('#dlg').close();render()};
  $('#dlg').showModal()}
function addMatch(){$('#dlg').innerHTML=`<h2>➕ Nový zápas</h2><label>Dátum a čas</label><div class="row"><input type="date" id="d"><input type="time" id="t"></div><label>Súper</label><input type="text" id="o">
  <label><input type="checkbox" id="h" checked> Doma</label><div class="row" style="margin-top:14px"><button class="btn o" id="x">Zrušiť</button><button class="btn" id="ok">Pridať</button></div>`;
  $('#x').onclick=()=>$('#dlg').close();
  $('#ok').onclick=()=>{const d=$('#d').value,o=$('#o').value.trim();if(!d||!o)return;const us='OŠK Chorvátsky Grob',hm=$('#h').checked;
    (S.manual=S.manual||[]).push({id:'m'+Date.now(),date:d,time:$('#t').value,home:hm?us:o,away:hm?o:us,hs:null,as:null});save();$('#dlg').close();render()};
  $('#dlg').showModal()}
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-t]'),c=ev.target.closest('[data-id]');
  if(t){
    tab=t.dataset.t;
    if(tab==='training')history.replaceState(null,'',TRAINING_HASH);
    else if(location.hash===TRAINING_HASH)history.replaceState(null,'',location.pathname+location.search);
    render();
  }else if(c)edit(c.dataset.id);else if(ev.target.id==='add')addMatch()});
window.addEventListener('hashchange',()=>{
  if(location.hash===TRAINING_HASH)tab='training';
  else if(tab==='training')tab='prog';
  render();
});
function refreshTrainingWeek(){
  if(tab!=='training')return;
  const dates=F.trainingWeek();
  if(dates[0]!==shownTrainingMonday)showTrainingPlan(dates);
}
setInterval(refreshTrainingWeek,60_000);
document.addEventListener('visibilitychange',refreshTrainingWeek);
$('#who').innerHTML=Object.entries(F.PROFILES).map(([k,p])=>`<option value="${k}">${p.name}</option>`).join('');
function start(){
  if(!Object.hasOwn(F.PROFILES,pid))pid='tomas';
  const profile=F.PROFILES[pid];
  $('#who').value=pid;
  S=load();sched=[];resu=[];tbl=null;officialPlayer=null;
  if(tab==='tbl'&&!profile.tablePart)tab='prog';
  render();refresh();
}
$('#who').onchange=e=>{pid=e.target.value;localStorage.setItem('futbal:last',pid);start()};
start();
</script></body></html>
